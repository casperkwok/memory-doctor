[project]
name = "memory-doctor"
version = "0.1.0"
description = "A maintenance/governance layer for LLM-agent long-term memory — the cure for context rot."
requires-python = ">=3.9"
dependencies = []  # zero runtime dependencies by design (v0.1 is pure stdlib)
authors = [{ name = "Casper Kwok" }]
license = { text = "Apache-2.0" }

[project.scripts]
memory-doctor = "memory_doctor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_doctor"]
